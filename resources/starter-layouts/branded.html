<!--
    Branded layout: coloured header bar with a logo slot, and a footer with an address.
    Replace the logo src with a file from your Contao file manager and switch "Embed
    images" on in the message so it displays without the recipient allowing remote content.
-->
<table role="presentation" class="sn-outer" width="100%" cellpadding="0" cellspacing="0" border="0">
    <tr>
        <td align="center" class="sn-outer-cell">
            <table role="presentation" class="sn-card" width="600" cellpadding="0" cellspacing="0" border="0">
                <tr>
                    <td class="sn-header" align="left">
                        <img class="sn-logo" src="/files/logo.png" width="132" alt="{{env::host}}">
                    </td>
                </tr>
                <tr>
                    <td class="sn-body">
                        ##message_body##
                    </td>
                </tr>
                <tr>
                    <td class="sn-footer">
                        <strong>Your Company</strong><br>
                        Street 1 &middot; 12345 Town &middot; <a class="sn-footer-link" href="{{env::url}}">{{env::host}}</a>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
